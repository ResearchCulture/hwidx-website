services:
  hwidx-website:
    build: .
    image: ghcr.io/researchculture/hwidx-website:latest
    container_name: hwidx-website
    networks:
      - http
    ports:
      - "8081:80/tcp"
    restart: unless-stopped

  # Serves redirects and the /api/v1 dataset API that the website's nginx proxies to
  hwidx-router:
    image: ghcr.io/researchculture/hwidx-router:latest
    container_name: hwidx-router
    networks:
      - http
    ports:
      - "8080:8080/tcp"
    environment:
      - NODE_ENV=production
      # The router clones this into the data folder on first start and pulls it every DATA_SYNC_INTERVAL seconds.
      # Set DATA_REPO to empty to serve the data folder as-is instead.
      - DATA_REPO=https://github.com/ResearchCulture/hwidx.git
      - DATA_BRANCH=main
      - DATA_SYNC_INTERVAL=300
    volumes:
      # The router's own clone of the hwidx dataset (written as the container's 'node' user, uid/gid 1000);
      # override with HWIDX_DATA_PATH. Start with an empty or missing folder to let the router clone it.
      - ${HWIDX_DATA_PATH:-./data}:/hwidx/config
      # Search/catalog column cache, kept between restarts and rebuilt when the dataset changes; override with HWIDX_CACHE_PATH
      - ${HWIDX_CACHE_PATH:-./cache}:/hwidx/cache
    restart: unless-stopped

networks:
  http:
    external: true
