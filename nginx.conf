server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Runs behind nginx-proxy-manager, which terminates TLS: keep any redirects relative,
    # otherwise they would point at http://<host>:80/ rather than the public https address
    absolute_redirect off;

    # Anything without a static page is an hwidx identifier; metapage.html renders it client-side.
    # Pages are small shells, so have browsers revalidate them and pick up new asset versions after a deploy.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ $uri.html /metapage.html;
    }

    # Catalog pages are rendered client-side; /catalog/<page>/ all share one shell
    location /catalog/ {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /catalog/index.html;
    }

    # CSS and JS URLs carry a per-build ?v= (see src/_data/build.js), so long caching is safe
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Live dataset API, served by the router container on the shared docker network.
    # Resolving via docker's DNS at request time lets nginx start even when the router is down.
    location /api/ {
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $hwidx_router http://hwidx-router:8080;
        proxy_pass $hwidx_router;
        proxy_set_header Host $host;
        # Appends nginx-proxy-manager's address to the client chain it sent; the router trusts private hops
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # The public scheme as seen by nginx-proxy-manager, not this container's plain http
        proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
    }
}
